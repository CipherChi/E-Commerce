    <circle cx="107" cy="104" r="91" fill="#071720" fill-opacity=".94" stroke-width="3" stroke-opacity=".62"/>
    <path d="M54 65h22l17 69h61l16-48H83"/>
    <circle cx="105" cy="153" r="6" fill="#7cf7b0" stroke="none"/>
    <circle cx="146" cy="153" r="6" fill="#7cf7b0" stroke="none"/>
