    <path d="M214 218h48" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
    <path d="M214 233h29" stroke="#7cf7b0" stroke-width="7" stroke-linecap="round"/>
    <rect x="302" y="143" width="56" height="102" rx="11" fill="#fff" fill-opacity=".08"/>
    <path d="M313 218h34M313 233h22" stroke="#7cf7b0" stroke-width="7" stroke-linecap="round"/>
    <rect x="91" y="258" width="258" height="10" rx="5" fill="#fff" fill-opacity=".12"/>
    <rect x="91" y="258" width="183" height="10" rx="5" fill="url(#accent)"/>
    <rect x="91" y="290" width="153" height="34" rx="17" fill="url(#accent)"/>
    <text x="168" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#082126">View sales</text>
