name: Feature request
description: Propose a product or engineering change
title: 'feature: '
labels: ['type:feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who is affected and what task is blocked?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and relevant tenant/security constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
