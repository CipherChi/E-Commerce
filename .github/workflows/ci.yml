name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  build:
    name: Install, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Lint
        run: pnpm lint
      - name: Build (all workspaces)
        run: pnpm build

  migrations:
    name: Migrations from empty DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to an empty database
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
      - name: Migration status is clean
        working-directory: apps/api
        run: pnpm exec prisma migrate status
      - name: Schema drift check (database after migrations vs schema.prisma)
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  unit:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Run unit tests
        working-directory: apps/api
        run: pnpm exec jest --coverage --ci --runInBand
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage

  e2e:
    name: API e2e + tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
      TENANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test?schema=public
      JWT_ACCESS_SECRET: ci-e2e-access-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Migrate test database
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
      - name: Run e2e (auth + tenant isolation)
        working-directory: apps/api
        run: pnpm exec jest --config ./test/jest-e2e.config.json --runInBand

  retail-playwright:
    name: Browser retail core flow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hotel_manager_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_manager_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TENANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hotel_manager_test?schema=public
      JWT_ACCESS_SECRET: ci-playwright-access-secret
      JWT_REFRESH_SECRET: ci-playwright-refresh-secret
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run browser retail core flow
        run: pnpm --filter web test:e2e

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high and above, production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: Dependency review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [build, migrations, unit, e2e, retail-playwright, security]
    steps:
      - name: Fail if any required job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | grep -Eq '"result": "(failure|cancelled)"'; then
            exit 1
          fi
